<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>imikdots 後台</title>
<style>
:root{--bg:#EEE6D8;--card:#F5EFE5;--olive:#3E4733;--olive2:#58624A;--cream:#F3EDE2;--ink:#2F3328;--muted:#8C8676;--line:rgba(47,51,40,.14);--warn:#A0603A;--sage:#DCE0CC}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:19px;letter-spacing:.12em;color:var(--olive)}
.btn{background:var(--olive);color:var(--cream);border-radius:8px;padding:8px 14px;font-size:13px;letter-spacing:.06em}
.btn.gh{background:transparent;border:1px solid var(--olive);color:var(--olive)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wr{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.login{max-width:360px;margin:60px auto;display:grid;gap:10px}
.login input,.bar input,.bar select,td select,td input{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff8;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.tabs button.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats b{font-size:20px;color:var(--olive)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1 1 220px;width:auto}
.bar select{flex:0 0 auto;width:auto}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;background:#0000000a}
td small{display:block;color:var(--muted);font-size:11.5px}
tr.click{cursor:pointer}tr.click:hover{background:#ffffff66}
td select{height:32px;width:auto}
td input.note{height:32px;min-width:120px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--olive)}
.tag.w{background:var(--olive);color:var(--cream)}
.tag.o{background:var(--warn);color:#fff}
.st-待對帳{color:var(--warn);font-weight:700}
.msg{color:var(--warn);font-size:13px}
.muted{color:var(--muted);font-size:12.5px}
.back{margin-bottom:10px}

/* ---- 排課 ---- */
.alert{background:#F6E7DA;border:1px solid #E2C3A8;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.alert b{color:var(--warn)}
.alert ul{margin:6px 0 0 18px;font-size:13px}
.alert li{margin:3px 0}
.mnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 0 12px}
.mnav .mt{text-align:center}
.mnav .mt small{display:block;font-size:10.5px;letter-spacing:.32em;color:var(--muted)}
.mnav h2{margin:2px 0 1px;font-size:26px;color:var(--olive);letter-spacing:.12em;line-height:1.2}
.mnav .mt span{font-size:12px;color:var(--muted)}
.mbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--olive);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal .wd.we{color:var(--olive2);font-weight:700}
.cal.sl-l{animation:calL .28s ease-out}.cal.sl-r{animation:calR .28s ease-out}
@keyframes calL{from{opacity:.3;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes calR{from{opacity:.3;transform:translateX(-24px)}to{opacity:1;transform:none}}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}
.cal .d{min-height:78px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d.out{opacity:.35}
.cal .d.past{background:#ece6da}
.cal .n{font-size:12px;font-weight:700;color:var(--olive);display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;align-self:flex-start}
/* 今天：日期數字變成深綠實心圓 */
.cal .d.today .n{background:var(--olive);color:var(--cream)}
/* 點選的日期：淡綠底＋深綠細框，不用白底 */
.cal .d.sel{background:var(--sage);border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.cal .d.sel.past{background:#d9dcc8}
.chip{font-size:10.5px;line-height:1.25;border-radius:4px;padding:1px 2px;letter-spacing:-.02em;background:var(--sage);color:var(--olive);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.t{background:var(--olive);color:var(--cream)}
.chip.x{background:#e3ddd2;color:#a39c8c;text-decoration:line-through}
.chip b{font-weight:700}.chip em{font-style:normal;font-weight:700;margin-left:1px}
.day{margin-top:14px}
.day h3{font-size:16px;color:var(--olive);margin-bottom:8px}
.qk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.qk small.t{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.qk .seg{margin-bottom:9px}
.qk .seg button{padding:7px 13px}
.more{font-size:12.5px;color:var(--olive);text-decoration:underline;padding:4px 0}
.adds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.adds button{border:1px dashed var(--olive);border-radius:10px;padding:8px 12px;color:var(--olive);background:#fff6;font-size:13px;text-align:left}
.adds button small{display:block;font-size:11px;color:var(--muted)}
.ss{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.ss.cx{background:#ebe5da}
.ss-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.ss-h b{font-size:15px}
.ss-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stu{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.stu .who small{display:block;color:var(--muted);font-size:11.5px}
.stu .acts{display:flex;gap:5px;flex-wrap:wrap}
.hist{font-size:11.5px;color:var(--muted);margin-top:2px}
.mdl{position:fixed;inset:0;background:rgba(30,32,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mdl-b{background:var(--cream);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 22px}
@media (min-width:640px){.mdl{align-items:center}.mdl-b{border-radius:16px}}
.mdl-b h3{font-size:16px;color:var(--olive);margin-bottom:12px}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
.fld textarea{height:70px;padding:8px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:#fff;font-size:13px}
.seg button.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.mdl-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pick{display:grid;gap:6px}
.pick button{text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.pick button small{color:var(--muted)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--olive);color:var(--cream);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 4px 16px #0003}
.wrap.in{padding-bottom:96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .ham{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.top .ham svg,.bnav svg,.drw svg{width:22px;height:22px;fill:none;stroke:var(--olive);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top .tt{flex:1}.top .tt small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.bnav{position:fixed;left:0;right:0;bottom:0;background:rgba(243,237,226,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 6px;border-radius:10px;min-width:58px}
.bnav button.on{color:var(--olive);font-weight:700;background:#3e47331a}
.bnav button.on svg{stroke-width:2}
.dbg{position:fixed;inset:0;background:rgba(30,32,26,.4);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.drw{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:80vw;background:var(--cream);z-index:56;transform:translateX(-102%);transition:transform .22s;padding:22px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 0 24px #0002}
body.dopen .dbg{opacity:1;pointer-events:auto}body.dopen .drw{transform:none}
.drw h2{font-size:17px;color:var(--olive);letter-spacing:.12em;margin:0 8px 14px}
.drw button,.drw a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;font-size:15px;text-decoration:none;color:var(--ink);text-align:left}
.drw button.on{background:#3e47331a;font-weight:700;color:var(--olive)}
.drw hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.drw .sub{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 10px}
.hi{font-size:18px;color:var(--olive);margin-bottom:12px;letter-spacing:.06em}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qa button{background:var(--olive);color:var(--cream);border-radius:12px;padding:14px 12px;text-align:left;font-size:14px}
.qa button.gh{background:var(--card);color:var(--olive);border:1px solid var(--line)}
.qa button small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.sec{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:16px 2px 8px}
.up{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.up button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:left}
.up button:last-child{border-bottom:0}
.up b{color:var(--olive)}.up .r{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pl{display:grid;gap:8px}
.pr{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.pr img,.pr .noimg{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#e3ddd2;flex:0 0 auto}
.pr .pi{flex:1;min-width:0}.pr .pi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .pi small{display:block;color:var(--muted);font-size:12px}
.pr.off{opacity:.6}
.sw{width:46px;height:28px;border-radius:99px;background:#cfc8b9;position:relative;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--olive)}.sw.on::after{left:21px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.ph div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e3ddd2}
.ph img{width:100%;height:100%;object-fit:cover}
.ph div i{position:absolute;left:4px;top:4px;font-style:normal;font-size:10px;background:var(--olive);color:var(--cream);padding:0 6px;border-radius:99px}
.ph div button{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:26px;text-align:center}
.ph .x{right:4px;top:4px}.ph .l{left:4px;bottom:4px}
.ph label{aspect-ratio:1;border:1px dashed var(--olive);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--olive);font-size:12.5px;cursor:pointer;background:#fff6;text-align:center}
.ph label input{display:none}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.og{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;background:#fff8}
.og input{margin-bottom:6px}
@media (max-width:600px){h1{font-size:17px}.stats b{font-size:17px}.cal .d{min-height:64px}.chip{font-size:9.5px}.wrap{padding:14px 10px 60px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted" style="padding:40px 0;text-align:center">載入中…</p></div>
<div id="mdl"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="sb-config.js?v=1124a"></script>
<script>
// imikdots 後台：排課、看會員、訂單，改對帳狀態，匯出電子報名單
// 排課（2026-11-23）：場次存在 Supabase，官網直接讀；每次改完會請 Google 試算表跟著同步
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBrx3RqcjnG-TIbsNJlAx_rC7WWA3s8NONsc-Fm_FZ_QUwrJo0A_H5UOTe7S3D_YD-NA/exec';
var A = { city: (function () { try { return localStorage.getItem('imk_city') || '台中'; } catch (e) { return '台中'; } })(), tab: 'home', brand: 'mandala', q: '', st: 'all', members: [], orders: [], sess: [], enr: [], ym: '', day: '', who: null, schedOff: false };
var app = document.getElementById('app'), mdl = document.getElementById('mdl');
var STATUS = ['待對帳', '已對帳', '已出貨', '已完成', '已取消'];
var BR = { mandala: '曼陀羅', ronin: '浪人' };
var CITIES = ['台北', '新北', '桃園', '新竹', '台中', '高雄'];
var SLOTS = [['早上', '09:00', '12:30'], ['下午', '13:30', '17:00'], ['晚上', '18:30', '22:00']];
var CNAME = { beginner: '零基礎', teacher: '研修班' };
var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return 'NT$' + (n || 0).toLocaleString('en-US'); }
function dt(d, t) { if (!d) return ''; var x = new Date(d); return x.getFullYear() + '/' + (x.getMonth() + 1) + '/' + x.getDate() + (t ? ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0') : ''); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function addDays(s, n) { var p = s.split('-'); return ymd(new Date(+p[0], +p[1] - 1, +p[2] + n)); }
function md(s) { var p = s.split('-'); return (+p[1]) + '/' + (+p[2]) + '（' + WEEK[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] + '）'; }
function sTime(s) { return s.time_start + '－' + s.time_end; }
function sDate(s) { return md(s.date) + (s.end_date && s.end_date !== s.date ? '～' + md(s.end_date) : ''); }
function sLabel(s) { return s.location + ' ' + sDate(s) + ' ' + sTime(s); }
function slotOf(s) { if (s.course === 'teacher') return '師'; var h = parseInt(s.time_start, 10); return h < 12 ? '早' : h < 18 ? '午' : '晚'; }
function toast(t) { var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 3800); }
function closeM() { mdl.innerHTML = ''; }

if (!SB_URL || !SB_KEY) { app.innerHTML = '<div class="card login"><h1>imikdots 後台</h1><p class="muted">會員系統還沒連上資料庫（sb-config.js 還沒填）</p></div>'; }
else {
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { detectSessionInUrl: false, persistSession: true } });
  sb.auth.getSession().then(function (r) { start(r.data.session && r.data.session.user); });
}

function loginView(msg) {
  ['bnav', 'drw'].forEach(function (id) { var x = document.getElementById(id); if (x) x.remove(); }); app.classList.remove('in');
  app.innerHTML = '<div class="card login"><h1>imikdots 後台</h1><p class="muted">用妳在網站註冊的會員帳號登入</p>' + (msg ? '<p class="msg">' + esc(msg) + '</p>' : '') +
    '<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="密碼" autocomplete="current-password"><button class="btn" id="go">登入</button></div>';
  document.getElementById('go').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '登入中…';
    sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }).then(function (r) {
      if (r.error) loginView('Email 或密碼不對'); else start(r.data.user);
    });
  };
}

function start(user) {
  if (!user) return loginView();
  A.who = user;
  sb.rpc('is_admin').then(function (r) {
    if (!r.data) { sb.auth.signOut(); return loginView('這個帳號沒有後台權限'); }
    load();
  });
}

function load(keep) {
  if (!keep) app.innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">讀取資料中…</p>';
  return Promise.all([
    sb.from('members').select('*').order('created_at', { ascending: false }).limit(5000),
    sb.from('orders').select('*').order('created_at', { ascending: false }).limit(5000),
    sb.rpc('admin_sessions'),
    sb.from('enrollments').select('*').order('id').limit(10000),
    sb.from('products').select('*').order('sort').order('created_at').limit(2000)
  ]).then(function (r) {
    A.prodOff = !!r[4].error; A.prods = r[4].data || [];
    A.members = r[0].data || []; A.orders = r[1].data || [];
    A.schedOff = !!r[2].error; A.sess = r[2].data || []; A.enr = r[3].data || [];
    render();
  });
}

function byBrand(x) { return A.brand === 'all' || x.brand === A.brand; }
function itemsText(o) { return (o.items || []).map(function (x) { return esc(x.name) + (x.detail ? '<small>' + esc(x.detail) + '</small>' : ''); }).join(''); }
function welcomeEnd(m) { var a = new Date(m.created_at).getTime() + 30 * 864e5, b = m.welcome_until ? new Date(m.welcome_until).getTime() : 0; return new Date(Math.max(a, b)); }

function render() {
  var ms = A.members.filter(byBrand), os = A.orders.filter(byBrand);
  var now = new Date(), ym = now.getFullYear() + '-' + now.getMonth();
  var monthOrders = os.filter(function (o) { var d = new Date(o.created_at); return d.getFullYear() + '-' + d.getMonth() === ym && o.status !== '已取消'; });
  var cur = navKey();
  var head = '<div class="top"><button class="ham" data-menu aria-label="選單">' + IC.menu + '</button><div class="tt"><h1>imikdots 後台</h1><small>' + (NAVS.filter(function (n) { return n[0] === cur; })[0] || NAVS[0])[1] + '</small></div></div>';
  var body = '';
  var q = A.q.toLowerCase();
  if (A.tab === 'home') {

function shrink(file) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () {
      var r = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('照片轉檔失敗')); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { rej(new Error('這張照片讀不到，換一張試試')); };
    img.src = URL.createObjectURL(file);
  });
}

      : '<p class="muted">還沒有可以換的場次。先在月曆上開一堂新課，再回來換。</p>') +
    '<p class="muted" style="margin-top:10px">想要的時間還沒開？先關掉這個視窗，在月曆上開好那堂課，再按「換場次」。</p>' +
    '<div class="mdl-f"><button class="btn gh" data-x>關閉</button></div></div></div>';
  mdl.onclick = function (ev) {
    if (ev.target.id === 'mBg' || ev.target.closest('[data-x]')) return closeM();
    var b = ev.target.closest('[data-to]'); if (!b) return;
    var s = sessOf(+b.dataset.to);
    if (!confirm('把 ' + (o.name || '') + ' 換到 ' + sLabel(s) + '？')) return;
    sb.rpc('admin_enroll_move', { p_id: eid, p_session: s.id }).then(function (r) {
      if (r.error) return alert('換場次失敗：' + r.error.message);
      closeM(); A.day = s.date; A.ym = s.date.slice(0, 7); done('已換到 ' + sLabel(s) + '，學生紀錄也改好了', [eid]);
    });
  };
}

// ---- 沒對到場次的報名，接到某一堂 ----
function linkPicker(eid) {
  var e = A.enr.filter(function (x) { return x.id === eid; })[0]; if (!e) return;
  var opts = A.sess.filter(function (s) { return s.status === '開放' && (!e.course || s.course === e.course); });
  mdl.innerHTML = '<div class="mdl" id="mBg"><div class="mdl-b"><h3>這筆報名是哪一堂？</h3><p class="muted" style="margin-bottom:10px">' + esc(orderOf(e).name) + '：' + esc(e.label) + '</p><div class="pick">' +
    opts.map(function (s) { return '<button data-to="' + s.id + '"><b>' + sDate(s) + '　' + sTime(s) + '</b>　' + esc(s.location) + '</button>'; }).join('') + '</div><div class="mdl-f"><button class="btn gh" data-x>關閉</button></div></div></div>';
  mdl.onclick = function (ev) {
    if (ev.target.id === 'mBg' || ev.target.closest('[data-x]')) return closeM();
    var b = ev.target.closest('[data-to]'); if (!b) return;
    sb.rpc('admin_enroll_link', { p_id: eid, p_session: +b.dataset.to }).then(function (r) { if (r.error) return alert(r.error.message); closeM(); done('接好了', []); });
  };
}

// ---- 退款 ----
function refundBox(eid) {
  var e = A.enr.filter(function (x) { return x.id === eid; })[0]; if (!e) return;
  var o = orderOf(e), sameOrder = A.enr.filter(function (x) { return x.order_id === e.order_id; });
  var def = sameOrder.length === 1 && o.total ? o.total : (e.price || 0) * (e.qty || 1);
  var s = sessOf(e.session_id), until = s ? addDays(s.date, 30) : addDays(today(), 30);
  var others = sameOrder.filter(function (x) { return x.id !== e.id && x.status !== '已退款' && x.status !== '已取消'; }).length;
  mdl.innerHTML = '<div class="mdl" id="mBg"><div class="mdl-b"><h3>退款給 ' + esc(o.name || '') + '</h3><p class="muted" style="margin-bottom:10px">' + esc(e.label) + '</p>' +
    '<div class="row2"><div class="fld"><label>退多少（元）</label><input id="rA" type="number" inputmode="numeric" value="' + def + '"></div><div class="fld"><label>退款日期</label><input id="rD" type="date" value="' + today() + '"></div></div>' +
    (o.discount && o.member_id ? (others ? '<p class="muted">這張訂單還有別的課沒退，首購折 100 先不還；全部退完才會還給他。</p>' : '<p class="muted">🌿 他用了首購折 100，退款後會還給他，可以用到 ' + md(until) + '（原本上課日之後 30 天）。</p>') : '') +
    '<p class="muted">這裡只是記錄，錢要妳自己轉回給學生。Google 報名表的「開課狀況」會自動改成「取消」，不算進營業額。</p>' +
    '<div class="mdl-f"><button class="btn gh" data-x>先不要</button><button class="btn" id="rOk">確定，已退款</button></div></div></div>';
  mdl.onclick = function (ev) {
    if (ev.target.id === 'mBg' || ev.target.closest('[data-x]')) return closeM();
    if (ev.target.id !== 'rOk') return;
    var b = ev.target; b.disabled = true;
    sb.rpc('admin_enroll_refund', { p_id: eid, p_amount: +document.getElementById('rA').value || 0, p_date: document.getElementById('rD').value || today() }).then(function (r) {
      if (r.error) { b.disabled = false; return alert('記錄失敗：' + r.error.message); }
      closeM(); done(r.data && r.data.welcome_back ? '已記錄退款，首購折 100 也還給他了' : '已記錄退款', [eid]);
    });
  };
}

function notifyMsg(eid) {
  var e = A.enr.filter(function (x) { return x.id === eid; })[0], o = orderOf(e);
  var t = '哈囉' + (o.name ? ' ' + o.name : '') + '，我是 Kimi 🌿\n妳報名的「' + String(e.label || '').replace(/・\d+ 人$/, '') + '」點點曼陀羅課程，因為報名人數沒有達到開班人數，這次很抱歉沒辦法開課 🙏\n\n想跟妳確認，妳比較想要：\n1️⃣ 全額退款\n2️⃣ 延期到其他場次（我把近期的時間傳給妳挑）\n\n回覆我一下就好，造成不便真的很不好意思！';
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('已複製，貼到 LINE 傳給學生就好'); }, function () { prompt('複製下面這段：', t); });
}

// 每次改完：重新讀資料、請 Google 試算表同步、提醒改 TimeTree
function done(msg, eids) {
  try {
    fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'sync', ids: eids || [] }) }).catch(function () {});
  } catch (x) {}
  load(true).then(function () { toast(msg + '。記得也改 TimeTree 🗓'); var db = document.getElementById('dayBox'); if (db) db.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
}

function bindSched() {
  var root = app;
  // 月曆左右滑：往左滑＝下個月，往右滑＝上個月
  var cg = document.getElementById('calGrid');
  if (cg) {
    var sx = 0, sy = 0;
    cg.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    cg.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var y = +A.ym.slice(0, 4), m = +A.ym.slice(5, 7) + (dx < 0 ? 1 : -1);
      A.ym = ymd(new Date(y, m - 1, 1)).slice(0, 7); A.day = ''; A.slide = dx < 0 ? 'l' : 'r'; render();
    }, { passive: true });
    if (A.slide) { cg.classList.add('sl-' + A.slide); A.slide = ''; }
  }
  root.querySelectorAll('[data-mon]').forEach(function (b) { b.onclick = function () { var y = +A.ym.slice(0, 4), m = +A.ym.slice(5, 7) + (+b.dataset.mon); var d = new Date(y, m - 1, 1); A.ym = ymd(d).slice(0, 7); A.day = ''; A.slide = +b.dataset.mon > 0 ? 'l' : 'r'; render(); }; });
  root.querySelectorAll('[data-day]').forEach(function (c) { c.onclick = function () { A.day = c.dataset.day; render(); var db = document.getElementById('dayBox'); if (db) db.scrollIntoView({ block: 'start', behavior: 'smooth' }); }; });
  root.querySelectorAll('[data-goday]').forEach(function (b) { b.onclick = function () { if (!b.dataset.goday) return; A.day = b.dataset.goday; A.ym = A.day.slice(0, 7); render(); document.getElementById('dayBox').scrollIntoView({ block: 'start', behavior: 'smooth' }); }; });
  function draft(k) {
    var on = A.city === '線上', x = SLOTS.filter(function (z) { return z[0] === k; })[0] || SLOTS[0];
    return k === '師資班' ? { course: 'teacher', date: A.day, end_date: addDays(A.day, 1), time_start: '09:00', time_end: '17:00', mode: '實體', location: A.city, note: '' }
      : { course: 'beginner', date: A.day, time_start: x[1], time_end: x[2], mode: on ? '線上' : '實體', location: A.city, note: '' };
  }
  root.querySelectorAll('[data-city]').forEach(function (b) { b.onclick = function () { A.city = b.dataset.city; try { localStorage.setItem('imk_city', A.city); } catch (e) {} render(); var db = document.getElementById('dayBox'); if (db) db.scrollIntoView({ block: 'start' }); }; });
  root.querySelectorAll('[data-add]').forEach(function (b) { b.onclick = function () { editor(draft('早上')); }; });
  root.querySelectorAll('[data-quick]').forEach(function (b) {
    b.onclick = function () {
      var e = draft(b.dataset.quick);
      var clash = A.sess.filter(function (s) { return s.status === '開放' && (s.date === e.date || (s.end_date && s.date <= e.date && s.end_date >= e.date)) && s.time_start < e.time_end && e.time_start < s.time_end; });
      if (clash.length && !confirm('這個時間已經有課：' + clash.map(sLabel).join('、') + '\n還是要再開一堂嗎？')) return;
      b.disabled = true;
      sb.rpc('admin_session_save', { p: e }).then(function (r) {
        b.disabled = false;
        if (r.error) return alert('開課失敗：' + r.error.message);
        done('已開好 ' + e.location + ' ' + md(e.date) + ' ' + b.dataset.quick + '，官網看得到了', []);
      });
    };
  });
  root.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { editor(sessOf(+b.dataset.edit)); }; });
  root.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = function () {
      var s = sessOf(+b.dataset.del); if (!confirm('刪除 ' + sLabel(s) + '？官網會馬上拿掉這堂。')) return;
      sb.rpc('admin_session_delete', { p_id: s.id }).then(function (r) { if (r.error) return alert(r.error.message); done('已刪除，官網也拿掉了', []); });
    };
  });
  root.querySelectorAll('[data-cancel]').forEach(function (b) {
    b.onclick = function () {
      var s = sessOf(+b.dataset.cancel);
      if (!confirm('取消開課：' + sLabel(s) + '？\n\n官網會馬上拿掉這堂，已報名的 ' + heads(enrOf(s.id)) + ' 人會變成「待處理」，再一個一個選退款、改別堂或延期。')) return;
      var ids = enrOf(s.id).map(function (x) { return x.id; });
      sb.rpc('admin_session_cancel', { p_id: s.id }).then(function (r) { if (r.error) return alert(r.error.message); done('已取消開課，下面幫每位學生選處理方式', ids); });
    };
  });
  root.querySelectorAll('[data-reopen]').forEach(function (b) {
    b.onclick = function () {
      var s = sessOf(+b.dataset.reopen); if (!confirm('恢復開課：' + sLabel(s) + '？還沒處理的學生會恢復成正常報名。')) return;
      sb.rpc('admin_session_reopen', { p_id: s.id }).then(function (r) { if (r.error) return alert(r.error.message); done('已恢復開課', enrOf(s.id, true).map(function (x) { return x.id; })); });
    };
  });
  root.querySelectorAll('[data-mv]').forEach(function (b) { b.onclick = function () { movePicker(+b.dataset.mv); }; });
  root.querySelectorAll('[data-link]').forEach(function (b) { b.onclick = function () { linkPicker(+b.dataset.link); }; });
  root.querySelectorAll('[data-rf]').forEach(function (b) { b.onclick = function () { refundBox(+b.dataset.rf); }; });
  root.querySelectorAll('[data-msg]').forEach(function (b) { b.onclick = function () { notifyMsg(+b.dataset.msg); }; });
  root.querySelectorAll('[data-pp]').forEach(function (b) {
    b.onclick = function () {
      var id = +b.dataset.pp; if (!confirm('改成「延期，日期還沒定」？錢先留著，之後在上方提醒裡幫他排新課。')) return;
      sb.rpc('admin_enroll_postpone', { p_id: id }).then(function (r) { if (r.error) return alert(r.error.message); done('已改成延期中', [id]); });
    };
  });
  var imp = document.getElementById('imp');
  if (imp) imp.onclick = function () {
    imp.disabled = true; imp.textContent = '匯入中…';
    Promise.all(['beginner', 'teacher'].map(function (k) {
      return fetch(APPS_SCRIPT_URL + '?course=' + k + '&source=sheet').then(function (r) { return r.json(); }).then(function (d) { return (Array.isArray(d) ? d : []).map(function (s) { return Object.assign({}, s, { course: k }); }); }).catch(function () { return []; });
    })).then(function (r) {
      var all = r[0].concat(r[1]).filter(function (s) { return s.date >= addDays(today(), -60); });
      if (!all.length) { imp.disabled = false; imp.textContent = '從 Google 試算表匯入現有場次'; return alert('讀不到 Google 試算表的場次，請稍後再試'); }
      return sb.rpc('admin_session_import', { p: all }).then(function (x) {
        if (x.error) return alert('匯入失敗：' + x.error.message);
        done('匯入 ' + x.data.added + ' 堂課', []);
      });
    });
  };
}

function bind() {
  var $ = function (id) { return document.getElementById(id); };
  if ($('brand')) $('brand').onchange = function () { A.brand = this.value; render(); };
  if ($('st')) $('st').onchange = function () { A.st = this.value; render(); };
  if ($('kd')) $('kd').onchange = function () { A.kind = this.value; render(); };
  if ($('q')) { var qi = $('q'); qi.oninput = function () { A.q = this.value; clearTimeout(qi._t); qi._t = setTimeout(function () { render(); var n = $('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); }; }
  document.querySelectorAll('[data-mid]').forEach(function (r) { r.onclick = function () { A.tab = r.dataset.mid; A.q = ''; render(); window.scrollTo(0, 0); }; });
  if (A.tab === 'sched') bindSched();
  if (A.tab === 'products') bindProducts();
  document.querySelectorAll('[data-oid]').forEach(function (s) {
    s.onchange = function () {
      var id = +s.dataset.oid, v = s.value;
      sb.from('orders').update({ status: v }).eq('id', id).then(function (r) {
        if (r.error) { alert('更新失敗：' + r.error.message); return; }
        A.orders.forEach(function (o) { if (o.id === id) o.status = v; }); s.className = 'st-' + v;
      });
    };
  });
  document.querySelectorAll('[data-nid]').forEach(function (inp) {
    inp.onchange = function () {
      var id = +inp.dataset.nid, v = inp.value;
      sb.from('orders').update({ admin_note: v }).eq('id', id).then(function (r) { if (r.error) alert('備註存檔失敗'); else A.orders.forEach(function (o) { if (o.id === id) o.admin_note = v; }); });
    };
  });
  if ($('csvM')) $('csvM').onclick = function () {
    var rows = [['姓名', 'Email', '手機', '生日', '加入日期', '事業']].concat(A.members.filter(byBrand).filter(function (m) { return m.newsletter; }).map(function (m) { return [m.name, m.email, m.phone, m.birthday || '', dt(m.created_at), BR[m.brand] || m.brand]; }));
    csv(rows, '電子報名單');
  };
  if ($('csvO')) $('csvO').onclick = function () {
    var rows = [['時間', '編號', '事業', '類型', '姓名', '手機', 'LINE', '內容', '原價', '會員折扣', '實付', '付款方式', '後五碼', '狀態', '備註']].concat(A.orders.filter(byBrand).map(function (o) {
      return [dt(o.created_at, 1), o.order_no, BR[o.brand] || o.brand, o.kind === 'course' ? '課程' : '商品', o.name, o.phone, o.line_name, (o.items || []).map(function (x) { return x.name + (x.detail ? '（' + x.detail + '）' : ''); }).join('；'), o.amount, o.discount, o.total, o.pay_method, o.last5, o.status, o.admin_note];
    }));
    csv(rows, '訂單');
  };
}

function csv(rows, name) {
  var s = '﻿' + rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv;charset=utf-8' }));
  a.download = name + '_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
}
</script>
</body>
